name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            native-tests -> target
      - run: npm ci
      - run: npm test
      - name: Native core tests
        run: cargo test --manifest-path native-tests/Cargo.toml
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - run: npm run build
      - name: Compile and test desktop backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run desktop:build -- --bundles nsis
      - name: Stage installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          New-Item -ItemType Directory -Force release-out | Out-Null
          $target = "release-out/Bimu_${version}_x64-setup.exe"
          Copy-Item $installer.FullName $target
          (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$target.sha256"
          "BIMU_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: Bimu-Windows-installer
          path: release-out/*
      - name: Publish version once
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:BIMU_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'This version is already published. Increment app, Cargo and npm versions to publish a new update.'
            exit 0
          }
          $assets = @(Get-ChildItem release-out -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Bimu $env:BIMU_VERSION" --notes 'Windows x64 installer. Download and run the setup executable once. Future versions can be checked and downloaded from Settings inside Bimu. Whisper CPU/GPU is managed inside the app. This installer is not Authenticode-signed.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
