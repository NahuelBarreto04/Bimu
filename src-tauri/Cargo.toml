[package]
name = "mascota-companero"
version = "0.33.0"
description = "Mi pequeño compañero de escritorio"
authors = ["Mariano"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

tokio = { version = "1", features = ["macros", "sync", "rt", "time"] }

tauri-plugin-dialog = "2"

pdf-extract = "0.12.1"
calamine = "0.31"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
sha2 = "0.10"
semver = "1"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.57", features = ["Foundation", "Media_Control", "Storage_Streams"] }

windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem"] }
